server.port=${PORT:8080}
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railway?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.mvc.format.date=iso
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.cancel-fee-percent=10
app.hold-minutes=10
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dev_secret}

# ============================================================
# Railway Reservation and Train Management System
# Spring Boot backend configuration
# ============================================================

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Application ---
spring.application.name=railway-reservation-backend

# --- Database (MySQL / MariaDB) ---
# Override any of these with environment variables when deploying.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railway_reservation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Serialise LocalDate / LocalDateTime as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- CORS (comma separated origins allowed to call the API) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# --- Logging ---
logging.level.root=INFO
logging.level.com.example.railway=INFO
